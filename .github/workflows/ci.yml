name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Validate Worker syntax
        run: node --check worker/worker.js

      - name: Install orchestrator
        run: python -m pip install -e ./src/orchestrator

      - name: Validate orchestrator CLI
        run: factorio-ai --help

      - name: Bootstrap and build patched FactorioMCP
        shell: pwsh
        run: ./scripts/bootstrap-factorio-mcp.ps1
